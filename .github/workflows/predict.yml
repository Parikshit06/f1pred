name: Predict

# Hourly across the race weekend, on Monday to grade the result and move on to
# the next race, and on Wednesday to log the next race's before-practice
# forecast.
on:
  # There is no "session finished" trigger, and session times move: sprint
  # weekends qualify on Friday, some races run on Saturday or at night, and
  # results reach a volunteer-run API some time after the flag. A run takes
  # about two minutes, so the schedule runs often and the code decides what,
  # if anything, to log:
  #
  #   predict.next_race  skips any race that has already started, so a late
  #                      run forecasts the next round, never one under way
  #   Prediction.save    writes at most one file per race per stage, and none
  #                      for a before-qualifying call more than five days out
  #
  # A run with nothing new to log refreshes the site and exits. Minutes sit off
  # the hour because GitHub drops scheduled runs at :00 first when it is busy.
  schedule:
    - cron: "17 * * * 5,6,0"  # hourly, Friday through Sunday
    - cron: "17 8,14 * * 1"   # Monday: grade the result, roll to the next
    - cron: "17 9 * * 3"      # Wednesday: log the next race's before-practice forecast
  workflow_dispatch:
    inputs:
      practice_history:
        description: "Also fetch the practice history (2024 onward) from FastF1"
        type: boolean
        default: false
      relog:
        description: "Log a new forecast even if this stage has one (after a fix; earlier files are kept)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same locked versions as CI and as the published reports.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The DATABASE is cached, not just the HTTP responses. jolpica's ingest
      # skips any season already in the ingest_log except the current one, and
      # that log lives in the database - so with only data/cache restored the
      # log was empty on every run and all nine seasons were walked again at
      # ~0.8 requests a second. That is the difference between a run taking
      # ninety minutes and taking a few.
      #
      # 2026 is re-fetched every time regardless, so a restored database can be
      # stale about the current season but never wrong about it, and `validate`
      # runs before anything is published either way.
      - name: Restore data
        uses: actions/cache@v5
        with:
          path: |
            data/cache
            data/f1.duckdb*
          key: f1data-${{ github.run_id }}
          restore-keys: f1data-

      # Cold start without this means walking 2018-2026 at 0.8 requests a
      # second, stalling on jolpica's hourly budget somewhere in 2025 and
      # waiting for the window to reset: about ninety minutes. The seasons
      # before the current one never change, so they do not have to be
      # re-derived from the API every time the cache expires. A published
      # snapshot of the database is enough, and 2026 is re-fetched regardless.
      #
      # The snapshot is also the only way practice history reaches CI. FastF1
      # cannot load F1's timing data from GitHub's runners, so those rows are
      # fetched on a local machine and published here. A snapshot with more
      # practice rows than the restored database replaces it, so publishing a
      # new one is enough for every later run to pick it up.
      #
      # The snapshot lives on a release rather than in git: it is a binary
      # that would sit in every clone forever. Publish a new one by zipping
      # data/f1.duckdb as f1.duckdb.zip and attaching it to the data-snapshot
      # release in the web UI, replacing the old file. If it is missing the run
      # still works, it is only slow.
      - name: Seed the database, or take a newer snapshot
        run: |
          mkdir -p data /tmp/snap
          base=https://github.com/${{ github.repository }}/releases/download/data-snapshot
          # Zipped first: GitHub's own upload form refuses some extensions, so
          # a .zip is the one shape that is always accepted. Raw second, for
          # whichever of the two actually got published.
          if curl -fsSL "$base/f1.duckdb.zip" -o /tmp/snap.zip; then
            unzip -o -j /tmp/snap.zip -d /tmp/snap/ >/dev/null
          else
            curl -fsSL "$base/f1.duckdb" -o /tmp/snap/f1.duckdb || rm -f /tmp/snap/f1.duckdb
          fi
          practice() {
            python -c "import sys, duckdb; print(duckdb.connect(sys.argv[1], read_only=True).execute('select count(*) from raw_session_pace').fetchone()[0])" "$1" 2>/dev/null || echo 0
          }
          have=0; [ -f data/f1.duckdb ] && have=$(practice data/f1.duckdb)
          snap=0; [ -f /tmp/snap/f1.duckdb ] && snap=$(practice /tmp/snap/f1.duckdb)
          echo "practice rows: restored database $have, snapshot $snap"
          if [ -f /tmp/snap/f1.duckdb ] && { [ ! -f data/f1.duckdb ] || [ "$snap" -gt "$have" ]; }; then
            rm -f data/f1.duckdb data/f1.duckdb.wal
            mv /tmp/snap/f1.duckdb data/f1.duckdb
            echo "seeded from the published snapshot"
          elif [ -f data/f1.duckdb ]; then
            echo "keeping the database restored from cache"
          else
            echo "no snapshot published, falling back to a full ingest"
          fi
          test -f data/f1.duckdb && ls -la data/f1.duckdb || true

      - name: Ingest
        run: python -m f1pred.cli ingest-jolpica --seasons 2018-2026

      # The official starting grid (penalties applied) and who is actually
      # entered this weekend. jolpica has neither before the race, and has
      # published results with the grid blank. A second source can't be allowed
      # to stop the run: without it the grid falls back to the qualifying order
      # and the forecast records that it did.
      - name: Starting grid and entry list (OpenF1)
        continue-on-error: true
        run: python -m f1pred.cli ingest-openf1 --seasons 2026

      # Practice pace for this weekend (FP1-FP3 per-driver aggregates). It
      # feeds the qualifying forecast, where held-out testing showed it helps.
      # Optional like OpenF1: without it the weekend keeps its before-practice
      # forecast. FastF1's own web cache is deliberately not restored between
      # runs: only the per-driver numbers are kept, in the database, so a
      # response fetched before or during a session can never be served again
      # in place of the finished one. Every session's outcome is logged.
      - name: Practice pace (FastF1, this weekend)
        continue-on-error: true
        run: python -m f1pred.cli ingest-fastf1 --next

      # The practice history the qualifying model is trained and graded on,
      # on request only (Run workflow, tick the box). Resumable, and FastF1
      # allows 500 requests an hour, so a large gap takes a few runs.
      - name: Practice history (FastF1, on request)
        if: ${{ inputs.practice_history }}
        continue-on-error: true
        timeout-minutes: 20
        run: python -m f1pred.cli ingest-fastf1 --history --seasons 2024-2026


      # Ingest applies the current finished/retired rule to rows it writes, but
      # rows already in the database keep whatever rule was in force when they
      # were written - and a seeded snapshot is exactly that. repair recomputes
      # the flag from the stored status text, which is the fact; the flag is
      # only a label. Idempotent, and it logs what it changed, so drift shows up
      # here rather than silently in the forecast.
      #
      # It does not weaken `validate`: repair aligns the flag with the current
      # rule, validate independently checks the flag against laps completed. A
      # genuinely new status word still fails, which is the point.
      - name: Repair status flags
        run: python -m f1pred.cli repair

      - name: Validate
        run: python -m f1pred.cli validate

      - name: Features
        run: python -m f1pred.cli build-features

      # No backtest here. It evaluates historical performance, which does not
      # change between Friday and Sunday, and re-running it per weekend with a
      # different window than the one the README reports would let the
      # published accuracy numbers drift away from the documented ones. It runs
      # on its own schedule in evaluate.yml and commits reports/*.json.

      - name: Predict
        run: python -m f1pred.cli predict --next ${{ inputs.relog && '--force-log' || '' }}

      - name: Dashboard
        run: python -m f1pred.cli dashboard

      # Published before anything is committed. The forecast is the
      # deliverable, so a push that loses a race must not take the site down
      # with it.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Commit prediction
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # predictions/ is the audit trail and reports/*.json are the measured
          # figures the README is checked against. The HTML is generated output
          # that Pages serves from the artifact above, so committing it bought
          # nothing and collided with every concurrent run.
          git add predictions
          git add reports/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Prediction $(date -u +%Y-%m-%d)"
          # Anything can land on the branch while a forecast is running - a
          # fix, another workflow, a rewritten history. Rebase and retry
          # instead of failing a run that has already done its work.
          for attempt in 1 2 3; do
            # A rebase left half-applied by a previous attempt makes every
            # later one fail with "unmerged files" rather than retrying
            # anything. Clear it first so each attempt starts from a clean
            # tree. -X theirs keeps this run's freshly generated files when
            # the two sides touch the same one; the forecast being published
            # is newer than whatever it is landing on top of.
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push attempt $attempt was rejected; retrying"
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          echo "could not push the forecast after three attempts" >&2
          exit 1

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
