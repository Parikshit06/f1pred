name: Predict

# Race weekends: Friday (pre-qualifying), Saturday evening (grid known),
# and Monday to grade the result once it is in.
on:
  # Sessions move, so the schedule covers the shapes a weekend can take rather
  # than assuming the usual one, and nothing here has to line up exactly with a
  # session. Two rules in the code make an early or late run harmless:
  #
  #   predict.next_race  skips any race whose start time has passed, so a run
  #                      that lands after the flag rolls to the next round
  #                      rather than forecasting a race that is already over
  #   Prediction.save    writes one file per race per stage, and withholds a
  #                      pre-qualifying forecast made more than five days out
  #
  # Azerbaijan is why the Saturday-morning run exists: it is the one Saturday race of
  # 2026, at 11:00 UTC, so the Saturday-evening run arrives eight hours late.
  # Its qualifying is on Friday, which the 20:00 Friday run already covers.
  #
  # Minutes are off the hour on purpose. GitHub queues every :00 cron in the
  # world at once and drops what it cannot serve, so "0 6 * * 5" is the most
  # contended minute available and the least likely to actually run.
  # Hourly across the race weekend, rather than at five guessed times.
  #
  # There is no "qualifying has finished" trigger - GitHub only does wall
  # clock - and session times move: sprint weekends qualify on Friday, Las
  # Vegas on Saturday night US time, Azerbaijan races on a Saturday morning.
  # Five carefully chosen slots still missed, because results reach a
  # volunteer-run API some unknown time after the flag.
  #
  # Guessing precisely was only worth it when a run cost ninety minutes. It
  # costs two, so run often and let the code decide what to do:
  #
  #   next_race     skips any race that has already started
  #   save()        writes one file per race per stage, and nothing at all
  #                 for a pre-qualifying call more than five days out
  #
  # So a run with nothing to do refreshes the page and exits. The cost is
  # about thirty requests against jolpica's 500/hour budget, most of them
  # cache hits, and runner minutes are free on a public repository. The
  # benefit is that a dropped scheduled run costs an hour, not a weekend.
  schedule:
    - cron: "17 * * * 5,6,0"  # hourly, Friday through Sunday
    - cron: "17 8,14 * * 1"   # Monday: grade the result, roll to the next
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same locked versions as CI and as the published reports.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The DATABASE is cached, not just the HTTP responses. jolpica's ingest
      # skips any season already in the ingest_log except the current one, and
      # that log lives in the database - so with only data/cache restored the
      # log was empty on every run and all nine seasons were walked again at
      # ~0.8 requests a second. That is the difference between a run taking
      # ninety minutes and taking a few.
      #
      # 2026 is re-fetched every time regardless, so a restored database can be
      # stale about the current season but never wrong about it, and `validate`
      # runs before anything is published either way.
      - name: Restore data
        uses: actions/cache@v5
        with:
          path: |
            data/cache
            data/fastf1_cache
            data/f1.duckdb*
          key: f1data-${{ github.run_id }}
          restore-keys: f1data-

      # Cold start without this means walking 2018-2026 at 0.8 requests a
      # second, stalling on jolpica's hourly budget somewhere in 2025 and
      # waiting for the window to reset: about ninety minutes. The seasons
      # before the current one never change, so they do not have to be
      # re-derived from the API every time the cache expires - a published
      # snapshot of the database is enough, and 2026 is re-fetched regardless.
      #
      # The snapshot lives on a release rather than in git: it is a 10MB binary
      # that would sit in every clone forever. Publish a new one with
      #   gh release upload data-snapshot data/f1.duckdb --clobber
      # or just attach the file to the release in the web UI. If it is missing
      # the run still works, it is only slow.
      - name: Seed the database if the cache was empty
        run: |
          if [ -f data/f1.duckdb ]; then
            echo "database restored from cache"; exit 0
          fi
          mkdir -p data
          base=https://github.com/${{ github.repository }}/releases/download/data-snapshot
          # Zipped first: GitHub's own upload form refuses some extensions, so
          # a .zip is the one shape that is always accepted. Raw second, for
          # whichever of the two actually got published.
          if curl -fsSL "$base/f1.duckdb.zip" -o /tmp/snap.zip; then
            unzip -o -j /tmp/snap.zip -d data/ >/dev/null
            echo "seeded from $base/f1.duckdb.zip"
          elif curl -fsSL "$base/f1.duckdb" -o data/f1.duckdb; then
            echo "seeded from $base/f1.duckdb"
          else
            echo "no snapshot published - falling back to a full ingest"
            rm -f data/f1.duckdb
          fi
          test -f data/f1.duckdb && ls -la data/f1.duckdb || true

      - name: Ingest
        run: python -m f1pred.cli ingest-jolpica --seasons 2018-2026

      # The official starting grid (penalties applied) and who is actually
      # entered this weekend. jolpica has neither before the race, and has
      # published results with the grid blank. A second source can't be allowed
      # to stop the run: without it the grid falls back to the qualifying order
      # and the forecast records that it did.
      - name: Starting grid and entry list (OpenF1)
        continue-on-error: true
        run: python -m f1pred.cli ingest-openf1 --seasons 2026

      # Practice pace for this weekend only (FP1-FP3 per-driver aggregates). It
      # feeds the qualifying forecast, where it measurably helps; nothing
      # historical is downloaded here. Optional like OpenF1: without it the
      # forecast waits until close to qualifying, then goes ahead.
      - name: Practice pace (FastF1, this weekend)
        continue-on-error: true
        run: python -m f1pred.cli ingest-fastf1 --next

      # Ingest applies the current finished/retired rule to rows it writes, but
      # rows already in the database keep whatever rule was in force when they
      # were written - and a seeded snapshot is exactly that. repair recomputes
      # the flag from the stored status text, which is the fact; the flag is
      # only a label. Idempotent, and it logs what it changed, so drift shows up
      # here rather than silently in the forecast.
      #
      # It does not weaken `validate`: repair aligns the flag with the current
      # rule, validate independently checks the flag against laps completed. A
      # genuinely new status word still fails, which is the point.
      - name: Repair status flags
        run: python -m f1pred.cli repair

      - name: Validate
        run: python -m f1pred.cli validate

      - name: Features
        run: python -m f1pred.cli build-features

      # No backtest here. It evaluates historical performance, which does not
      # change between Friday and Sunday, and re-running it per weekend with a
      # different window than the one the README reports would let the
      # published accuracy numbers drift away from the documented ones. It runs
      # on its own schedule in evaluate.yml and commits reports/*.json.

      - name: Predict
        run: python -m f1pred.cli predict --next

      - name: Dashboard
        run: python -m f1pred.cli dashboard

      # Published BEFORE anything is committed. The forecast is the
      # deliverable; a push that loses a race must not be able to take the site
      # down with it, which is exactly what the original order allowed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Commit prediction
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # predictions/ is the audit trail and reports/*.json are the measured
          # figures the README is checked against. The HTML is generated output
          # that Pages serves from the artifact above, so committing it bought
          # nothing and collided with every concurrent run.
          git add predictions
          git add reports/*.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Prediction $(date -u +%Y-%m-%d)"
          # Anything can land on the branch while a forecast is running - a
          # fix, another workflow, a rewritten history. Rebase and retry
          # instead of failing a run that has already done its work.
          for attempt in 1 2 3; do
            # A rebase left half-applied by a previous attempt makes every
            # later one fail with "unmerged files" rather than retrying
            # anything. Clear it first so each attempt starts from a clean
            # tree. -X theirs keeps this run's freshly generated files when
            # the two sides touch the same one; the forecast being published
            # is newer than whatever it is landing on top of.
            git rebase --abort 2>/dev/null || true
            if git pull --rebase -X theirs --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push attempt $attempt was rejected; retrying"
            sleep 5
          done
          git rebase --abort 2>/dev/null || true
          echo "could not push the forecast after three attempts" >&2
          exit 1

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
