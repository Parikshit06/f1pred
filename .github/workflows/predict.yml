name: Predict

# Race weekends: Friday (pre-qualifying), Saturday evening (grid known),
# and Monday to grade the result once it is in.
on:
  # Sessions move, so the schedule covers the shapes a weekend can take rather
  # than assuming the usual one, and nothing here has to line up exactly with a
  # session. Two rules in the code make an early or late run harmless:
  #
  #   predict.next_race  skips any race whose start time has passed, so a run
  #                      that lands after the flag rolls to the next round
  #                      rather than forecasting a race that is already over
  #   Prediction.save    writes one file per race per stage, and withholds a
  #                      pre-qualifying forecast made more than five days out
  #
  # Azerbaijan is why the first of those exists: it is the one Saturday race of
  # 2026, at 11:00 UTC, so the Saturday-evening run arrives eight hours late.
  # Its qualifying is on Friday, which the 20:00 Friday run already covers.
  schedule:
    - cron: "0 6 * * 5"    # Fri 06:00 UTC - before any qualifying
    - cron: "0 20 * * 5"   # Fri 20:00 UTC - sprint and Saturday-race weekends
    - cron: "0 19 * * 6"   # Sat 19:00 UTC - normal weekends, grid known
    - cron: "0 6 * * 0"    # Sun 06:00 UTC - Las Vegas qualifies Sat night US
    - cron: "0 8 * * 1"    # Mon 08:00 UTC - grade the result, roll to the next
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: predict
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # The HTTP cache is what keeps us inside jolpica's rate limit. Without
      # it every run re-fetches nine seasons.
      - name: Restore data cache
        uses: actions/cache@v5
        with:
          path: data/cache
          key: jolpica-${{ github.run_id }}
          restore-keys: jolpica-

      - name: Ingest
        run: python -m f1pred.cli ingest-jolpica --seasons 2018-2026

      - name: Validate
        run: python -m f1pred.cli validate

      - name: Features
        run: python -m f1pred.cli build-features

      # No backtest here. It evaluates historical performance, which does not
      # change between Friday and Sunday, and re-running it per weekend with a
      # different window than the one the README reports would let the
      # published accuracy numbers drift away from the documented ones. It runs
      # on its own schedule in evaluate.yml and commits reports/*.json.

      - name: Predict
        run: python -m f1pred.cli predict --next

      - name: Dashboard
        run: python -m f1pred.cli dashboard

      # Published BEFORE anything is committed. The forecast is the
      # deliverable; a push that loses a race must not be able to take the site
      # down with it, which is exactly what the original order allowed.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: reports

      - name: Commit prediction
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions reports
          if git diff --staged --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "Prediction $(date -u +%Y-%m-%d)"
          # Anything can land on the branch while a forecast is running - a
          # fix, another workflow, a rewritten history. Rebase and retry
          # instead of failing a run that has already done its work.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            echo "push attempt $attempt was rejected; retrying"
            sleep 5
          done
          echo "could not push the forecast after three attempts" >&2
          exit 1

  deploy:
    needs: predict
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
