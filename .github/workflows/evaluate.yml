name: Evaluate

# Historical evaluation, kept apart from the race-weekend pipeline.
#
# These numbers describe how the model has performed, not what happens on
# Sunday, so they are re-measured when the model or the data window changes -
# not three times a race weekend. Keeping them on a separate schedule is also
# what stops the published accuracy figures drifting away from the ones written
# down in the README.
#
# All slow by design. The backtest fits its settings on 2022-23 and then refits
# per race across the reported seasons, before and after qualifying. The title
# backtest refits at checkpoints through each of seven seasons. The experiments
# behind the design choices (make experiments) take about an hour more and are
# run by hand when the model changes, not every month.

on:
  schedule:
    - cron: "0 4 1 * *"    # 1st of the month, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Same locked versions as CI and as the published reports.
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install
        run: |
          uv sync --locked --extra dev
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      # The DATABASE is cached, not just the HTTP responses. jolpica's ingest
      # skips any season already in the ingest_log except the current one, and
      # that log lives in the database - so with only data/cache restored the
      # log was empty on every run and all nine seasons were walked again at
      # ~0.8 requests a second. That is the difference between a run taking
      # ninety minutes and taking a few.
      #
      # 2026 is re-fetched every time regardless, so a restored database can be
      # stale about the current season but never wrong about it, and `validate`
      # runs before anything is published either way.
      - name: Restore data
        uses: actions/cache@v5
        with:
          path: |
            data/cache
            data/f1.duckdb*
          key: f1data-${{ github.run_id }}
          restore-keys: f1data-

      # Cold start without this means walking 2018-2026 at 0.8 requests a
      # second, stalling on jolpica's hourly budget somewhere in 2025 and
      # waiting for the window to reset: about ninety minutes. The seasons
      # before the current one never change, so they do not have to be
      # re-derived from the API every time the cache expires. A published
      # snapshot of the database is enough, and 2026 is re-fetched regardless.
      #
      # The snapshot is also the only way practice history reaches CI. FastF1
      # cannot load F1's timing data from GitHub's runners, so those rows are
      # fetched on a local machine and published here. A snapshot with more
      # practice rows than the restored database replaces it, so publishing a
      # new one is enough for every later run to pick it up.
      #
      # The snapshot lives on a release rather than in git: it is a binary
      # that would sit in every clone forever. Publish a new one by zipping
      # data/f1.duckdb as f1.duckdb.zip and attaching it to the data-snapshot
      # release in the web UI, replacing the old file. If it is missing the run
      # still works, it is only slow.
      - name: Seed the database, or take a newer snapshot
        run: |
          mkdir -p data /tmp/snap
          base=https://github.com/${{ github.repository }}/releases/download/data-snapshot
          # Zipped first: GitHub's own upload form refuses some extensions, so
          # a .zip is the one shape that is always accepted. Raw second, for
          # whichever of the two actually got published.
          if curl -fsSL "$base/f1.duckdb.zip" -o /tmp/snap.zip; then
            unzip -o -j /tmp/snap.zip -d /tmp/snap/ >/dev/null
          else
            curl -fsSL "$base/f1.duckdb" -o /tmp/snap/f1.duckdb || rm -f /tmp/snap/f1.duckdb
          fi
          practice() {
            python -c "import sys, duckdb; print(duckdb.connect(sys.argv[1], read_only=True).execute('select count(*) from raw_session_pace').fetchone()[0])" "$1" 2>/dev/null || echo 0
          }
          have=0; [ -f data/f1.duckdb ] && have=$(practice data/f1.duckdb)
          snap=0; [ -f /tmp/snap/f1.duckdb ] && snap=$(practice /tmp/snap/f1.duckdb)
          echo "practice rows: restored database $have, snapshot $snap"
          if [ -f /tmp/snap/f1.duckdb ] && { [ ! -f data/f1.duckdb ] || [ "$snap" -gt "$have" ]; }; then
            rm -f data/f1.duckdb data/f1.duckdb.wal
            mv /tmp/snap/f1.duckdb data/f1.duckdb
            echo "seeded from the published snapshot"
          elif [ -f data/f1.duckdb ]; then
            echo "keeping the database restored from cache"
          else
            echo "no snapshot published, falling back to a full ingest"
          fi
          test -f data/f1.duckdb && ls -la data/f1.duckdb || true

      - name: Ingest
        run: python -m f1pred.cli ingest-jolpica --seasons 2018-2026

      # The official starting grid (penalties applied) and who is actually
      # entered this weekend. jolpica has neither before the race, and has
      # published results with the grid blank. A second source can't be allowed
      # to stop the run: without it the grid falls back to the qualifying order
      # and the forecast records that it did.
      - name: Starting grid and entry list (OpenF1)
        continue-on-error: true
        run: python -m f1pred.cli ingest-openf1 --seasons 2026

      # The practice history the qualifying model is graded with. Tried in case
      # the runner can reach F1's timing data. So far it never has, and the
      # history arrives in the snapshot above instead. A session that comes
      # back empty is never marked as done, so a failed attempt costs nothing.
      - name: Practice history (FastF1)
        continue-on-error: true
        timeout-minutes: 10
        run: python -m f1pred.cli ingest-fastf1 --history --seasons 2024-2026

      # Ingest applies the current finished/retired rule to rows it writes, but
      # rows already in the database keep whatever rule was in force when they
      # were written - and a seeded snapshot is exactly that. repair recomputes
      # the flag from the stored status text, which is the fact; the flag is
      # only a label. Idempotent, and it logs what it changed, so drift shows up
      # here rather than silently in the forecast.
      #
      # It does not weaken `validate`: repair aligns the flag with the current
      # rule, validate independently checks the flag against laps completed. A
      # genuinely new status word still fails, which is the point.
      - name: Repair status flags
        run: python -m f1pred.cli repair

      - name: Validate
        run: python -m f1pred.cli validate

      - name: Features
        run: python -m f1pred.cli build-features

      # Through the Makefile on purpose: the reported window and the tuning
      # season are defined once, in START and TUNE there, so this workflow and
      # a run on someone's laptop cannot report different numbers under the
      # same name.
      - name: Backtest
        run: make backtest

      - name: Title backtest
        run: python -m f1pred.cli title-backtest

      # Re-fits how wide the projection's range has to be to keep its stated
      # 10th-90th promise, and re-grades that choice on held-out seasons. The
      # coverage numbers on the method page come from here.
      - name: Calibrate projection spread
        run: python -m f1pred.cli calibrate-spread

      - name: Verify
        run: python -m f1pred.cli verify

      # The pages read these reports, so render them here: a report the site
      # cannot read fails this run rather than the next forecast. The site
      # itself is deployed by predict.yml, which rebuilds it from the committed
      # reports on its next scheduled run.
      - name: Check the pages render against the new evidence
        run: python -m f1pred.cli dashboard

      - name: Commit evaluation
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git diff --staged --quiet && exit 0
          git commit -m "Evaluation $(date -u +%Y-%m-%d)"
          # A forecast run may have pushed in the meantime. Its files and these
          # never overlap (predictions/ against reports/), so a rebase is safe.
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push
