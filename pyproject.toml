[project]
name = "f1pred"
version = "0.1.0"
description = "Calibrated top-5 qualifying and race forecasts for Formula 1"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "requests>=2.32",
    "pyyaml>=6.0",
    "fastf1>=3.4",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "shap>=0.46",
    "plotly>=5.24",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# ruff is PINNED, not floated. A linter's default rule set grows between minor
# versions, so `ruff>=0.6` meant CI installed whatever was newest that morning
# and could fail a commit that passed locally the day before - which is exactly
# what happened going from 0.15 to 0.16 (42 new findings, none of them a change
# in this code). Bump it deliberately, fix what it finds, commit both together.
dev = ["pytest>=8.3", "ruff==0.16.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1pred"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
