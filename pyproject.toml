[project]
name = "f1pred"
version = "0.1.0"
description = "Probabilistic forecasts for Formula 1 qualifying, races and the championship"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "duckdb>=1.1",
    "requests>=2.32",
    "fastf1>=3.4",
    "xgboost>=2.1",
    "scikit-learn>=1.5",  # XGBRanker is xgboost's sklearn interface
    "shap>=0.46",
]

[project.optional-dependencies]
# ruff is pinned: its default rules grow between minor versions.
dev = ["pytest>=8.3", "ruff==0.16.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f1pred"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
